
name: Build and Deploy Jekyll Site

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install and build
        run: |
          gem install bundler
          bundle install
          bundle exec jekyll build --trace

      # ✅ Use the Pages-specific artifact action (compliant)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ✅ Deploy using the Pages deploy action (compliant)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

